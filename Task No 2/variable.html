<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<body>
    <script>
    var myString = "Hello, World!";     // String
    let myNumber = 42;                  // Number
    const myBoolean = true;             // Boolean
    let myUndefined;                    // Undefined (no value assigned yet)
    let myNull = null;                  // Null
    let myBigInt = 12345678901234567890n; // BigInt
    let mySymbol = Symbol("uniqueId");  // Symbol
    let myObject = { name: "Alice", age: 30 }; // Object

    console.log("String:", myString);
    console.log("Number:", myNumber);
    console.log("Boolean:", myBoolean);
    console.log("Undefined:", myUndefined);
    console.log("Null:", myNull);
    console.log("BigInt:", myBigInt);
    console.log("Symbol:", mySymbol);
    console.log("Object:", myObject);
</script>

</body>
</html>
