<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expressions</title>
</head>
<body>
    <script>
    // Arithmetic expressions
    console.log("1 + 2 =", 1 + 2);
    console.log("10 - 4 =", 10 - 4);
    console.log("3 * 5 =", 3 * 5);
    console.log("20 / 4 =", 20 / 4);
    console.log("10 % 3 =", 10 % 3);

    // String expressions
    console.log("Hello " + "World", "Hello " + "World");
    console.log("'5' + 2 =", "5" + 2);
    console.log("'5' - 2 =", "5" - 2);

    // Comparison expressions
    console.log("5 > 3 =", 5 > 3);
    console.log("5 < 3 =", 5 < 3);
    console.log("5 == '5' =", 5 == "5");
    console.log("5 === '5' =", 5 === "5");

    // Logical expressions
    console.log("true && false =", true && false);
    console.log("true || false =", true || false);
    console.log("!true =", !true);

    // Unary operators
    let x = 5;
    console.log(+x);
    console.log(-x);
    console.log(++x);
    console.log(--x);
    console.log(typeof x);
    console.log(!true);

// Assignment operators
let a = 10;
console.log("a =", a);

a += 5;
console.log("a += 5 ->", a);

a -= 3;
console.log("a -= 3 ->", a);

a *= 2;
console.log("a *= 2 ->", a);

a /= 4;
console.log("a /= 4 ->", a);

a %= 3;
console.log("a %= 3 ->", a);

a **= 2;
console.log("a **= 2 ->", a);

let c;
let d;
d = (c = 100);
console.log("c =", c, ", d =", d);

let m, n, o;
m = n = o = 50;
console.log("m =", m, ", n =", n, ", o =", o);

</script>

</body>
</html>
