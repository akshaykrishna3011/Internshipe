<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array 1</title>
  </head>
  <body>
    <script>
      let number = [2, 4, 2, 3, 5, 1, 3];
      let largest = Math.max(...number);
      document.write("Largest number is :", largest,"<br>");

      let numbers = [2, 4, 2, 3, 5, 1, 3];

      let uniqueNumbers = [...new Set(numbers)];

      document.write("Array without duplicates:", uniqueNumbers,);
    </script>
  </body>
</html>
