<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication table</title>
</head>
<body>
    <script>
        let num = 5;
        let c ='';
        for(let i = 1 ;i <= 10; i++)
    {
        c +=`${i} *  ${num} = ${i * num}\n`;
    }
        console.log(c)
    </script>
</body>
</html>
