<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Example</title>
</head>
<body>
  <script>
    let user = {
      name: "Chhota Bheem",
      age: "19",
      gender: "Male",
      email: "chhotabheem@gmail.com"
    };

    console.log("Name :", user.name);
    console.log("Age :", user.age);
    console.log("Email :", user.email);
  </script>
</body>
</html>
